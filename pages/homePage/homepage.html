<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./homepage.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Taviraj:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Ecobazar</title>
  </head>
  <body>
    <!--melisa navbar section start-->
    <header>
      <div class="header_container">
        <nav class="nav_links">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">Pages</a>
          <a href="#">Blog</a>
          <a href="#">About Us</a>
        </nav>

        <div class="logo">
          <img src="./../../images/navbar/Logo.svg" alt="Logo" />
          <h2>Ecobazar</h2>
        </div>

        <div class="nav_actions">
          <div class="search-container">
            <button class="search-btn">
              <img src="./../../images/navbar/Search.svg" alt="" />
            </button>
            <input type="text" class="search-input" placeholder="Ara..." />
          </div>
          <button class="phone-container">
            <img src="./../../images/navbar/Call.svg" alt="" /><span
              >(219) 555-0114</span
            >
          </button>
          <button><img src="./../../images/navbar/Heart.svg" alt="" /></button>
          <button><img src="./../../images/navbar/Cart.svg" alt="" /></button>
          <button>
            <img src="./../../images/navbar/user_3 1.svg" alt="" />
          </button>
        </div>

        <button class="hamburger">&#9776;</button>
      </div>

      <div class="mobile_menu">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Pages</a>
        <a href="#">Blog</a>
        <a href="#">About Us</a>
      </div>
    </header>

    <!--melisa navbar section end-->

    <!--Kübra Features Section Start -->
    <section id="features">
      <div class="info-container">
        <div class="info-box active">
          <div class="icon-wrapper">
            <img
              src="./../../images/delivery-truck 1.svg"
              alt="Free Shipping"
            />
          </div>
          <div class="info-text">
            <h4>Free Shipping</h4>
            <p>Free shipping with discount</p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon-wrapper">
            <img
              src="./../../images/headphones 1.svg"
              alt="Customer Support 24/7"
            />
          </div>
          <div class="info-text">
            <h4>Great Support 24/7</h4>
            <p>Instant access to Contact</p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon-wrapper">
            <img src="./../../images/package.svg" alt="Secure Payment" />
          </div>
          <div class="info-text">
            <h4>100% Secure Payment</h4>
            <p>We ensure your money is save</p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon-wrapper">
            <img
              src="./../../images/shopping-bag.svg"
              alt="Money-Back Guarantee"
            />
          </div>
          <div class="info-text">
            <h4>Money-Back Guarantee</h4>
            <p>30 Days Money-Back Guarantee</p>
          </div>
        </div>
      </div>
    </section>
    <!--Kübra Features Section End -->

    <!-- JS -->
    <script src="./homepage.js"></script>
  </body>
</html>
